name: Build AI Dungeon Scenario Formatter

on: [push]

jobs:
  build:
    runs-on: windows-latest  # Use Windows runner to support icons

    steps:
      - uses: actions/checkout@v3

      - name: Install Python and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Executable with Icon
        run: pyinstaller --onefile --noconsole --icon="icon.ico" --name="AI Dungeon Scenario Formatter" Formatter_V3.5_GUI.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Dungeon-Scenario-Formatter
          path: dist/AI Dungeon Scenario Formatter.exe # Path to the PyInstaller output